<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif">
  <!-- Fundo -->
  <rect width="1000" height="640" fill="#ffffff"/>

  <!-- Título -->
  <text x="500" y="50" font-size="28" font-weight="700" text-anchor="middle" fill="#2d2d2d">Nem toda oferta enviada converte</text>
  <rect x="460" y="64" width="80" height="4" rx="2" fill="#EA1D2C"/>
  <text x="500" y="95" font-size="15" text-anchor="middle" fill="#8a8a8a">Taxa de sucesso por tipo de oferta (dados históricos, ~63 mil instâncias)</text>

  <!-- Funil contínuo (2 estágios: enviado -> convertido) -->
  <polygon points="260,130 740,130 600,220 400,220" fill="#F6D6D8"/>
  <text x="500" y="168" font-size="17" font-weight="700" text-anchor="middle" fill="#5a2a2d">100% dos envios</text>
  <text x="500" y="190" font-size="12" text-anchor="middle" fill="#8a6062">recebem a oferta</text>

  <polygon points="400,220 600,220 560,290 440,290" fill="#EA1D2C"/>
  <text x="500" y="262" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">~39% convertem</text>

  <!-- KPI: taxa de sucesso por tipo de oferta (barras horizontais estilo pill) -->
  <g>
    <text x="150" y="351" font-size="16" font-weight="700" fill="#2d2d2d">Discount</text>
    <rect x="340" y="330" width="460" height="32" rx="16" fill="#F3D9DB"/>
    <rect x="340" y="330" width="191.4" height="32" rx="16" fill="#EA1D2C"/>
    <text x="815" y="351" font-size="16" font-weight="700" fill="#2d2d2d">41.6%</text>
  </g>

  <g>
    <text x="150" y="431" font-size="16" font-weight="700" fill="#2d2d2d">Informational</text>
    <rect x="340" y="410" width="460" height="32" rx="16" fill="#F3D9DB"/>
    <rect x="340" y="410" width="178.0" height="32" rx="16" fill="#EA1D2C"/>
    <text x="815" y="431" font-size="16" font-weight="700" fill="#2d2d2d">38.7%</text>
  </g>

  <g>
    <text x="150" y="511" font-size="16" font-weight="700" fill="#2d2d2d">BOGO</text>
    <rect x="340" y="490" width="460" height="32" rx="16" fill="#F3D9DB"/>
    <rect x="340" y="490" width="167.0" height="32" rx="16" fill="#EA1D2C"/>
    <text x="815" y="511" font-size="16" font-weight="700" fill="#2d2d2d">36.3%</text>
  </g>

  <!-- Callout -->
  <rect x="150" y="560" width="700" height="50" rx="10" fill="#FBEAEB"/>
  <rect x="150" y="560" width="6" height="50" rx="3" fill="#EA1D2C"/>
  <text x="503" y="591" font-size="16" font-weight="700" text-anchor="middle" fill="#C21807">Em média, 6 em cada 10 envios não geram conversão</text>
</svg>
