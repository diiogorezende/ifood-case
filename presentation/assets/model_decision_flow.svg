<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="Arial, Helvetica, sans-serif">
  <!-- Fundo -->
  <rect width="1200" height="430" fill="#ffffff"/>

  <!-- Título -->
  <text x="600" y="42" font-size="26" font-weight="700" text-anchor="middle" fill="#2d2d2d">Como o modelo apoia a decisão</text>
  <rect x="560" y="54" width="80" height="4" rx="2" fill="#EA1D2C"/>
  <text x="600" y="78" font-size="14" text-anchor="middle" fill="#8a8a8a">Do dado histórico até a decisão de enviar (ou não) a oferta</text>

  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#EA1D2C"/>
    </marker>
  </defs>

  <!-- Seta 1 -->
  <line x1="362" y1="240" x2="446" y2="240" stroke="#EA1D2C" stroke-width="4" marker-end="url(#arrowhead)"/>
  <!-- Seta 2 -->
  <line x1="752" y1="240" x2="836" y2="240" stroke="#EA1D2C" stroke-width="4" marker-end="url(#arrowhead)"/>

  <!-- ===================== Caixa 1: Dados históricos ===================== -->
  <g>
    <rect x="60" y="110" width="300" height="260" rx="20" fill="#ffffff" stroke="#F3D9DB" stroke-width="3"/>
    <circle cx="92" cy="142" r="18" fill="#F3D9DB"/>
    <text x="92" y="147" font-size="14" font-weight="700" text-anchor="middle" fill="#8B3A3F">1</text>

    <!-- ícone: tabela -->
    <rect x="170" y="160" width="80" height="18" rx="6" fill="#F3D9DB"/>
    <rect x="170" y="160" width="80" height="60" rx="6" fill="none" stroke="#EA1D2C" stroke-width="3"/>
    <line x1="170" y1="196" x2="250" y2="196" stroke="#EA1D2C" stroke-width="2"/>
    <line x1="210" y1="178" x2="210" y2="220" stroke="#EA1D2C" stroke-width="2"/>

    <text x="210" y="300" font-size="18" font-weight="700" text-anchor="middle" fill="#2d2d2d">Dados históricos</text>
    <text x="210" y="326" font-size="13" text-anchor="middle" fill="#767676">Transações, ofertas e</text>
    <text x="210" y="344" font-size="13" text-anchor="middle" fill="#767676">perfil de cada cliente</text>
  </g>

  <!-- ===================== Caixa 2: Modelo preditivo (destaque) ===================== -->
  <g>
    <rect x="450" y="110" width="300" height="260" rx="20" fill="#EA1D2C"/>
    <circle cx="482" cy="142" r="18" fill="#ffffff"/>
    <text x="482" y="147" font-size="14" font-weight="700" text-anchor="middle" fill="#EA1D2C">2</text>

    <!-- ícone: medidor de probabilidade -->
    <path d="M 558 195 A 42 42 0 0 1 642 195" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
    <path d="M 558 195 A 42 42 0 0 1 642 195" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-dasharray="92.3 39.6"/>
    <line x1="600" y1="195" x2="625" y2="161" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="600" cy="195" r="5" fill="#ffffff"/>

    <text x="600" y="300" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Modelo preditivo</text>
    <text x="600" y="326" font-size="13" text-anchor="middle" fill="#FBEAEB">Estima a probabilidade de</text>
    <text x="600" y="344" font-size="13" text-anchor="middle" fill="#FBEAEB">sucesso de cada oferta</text>
  </g>

  <!-- ===================== Caixa 3: Decisão de envio ===================== -->
  <g>
    <rect x="840" y="110" width="300" height="260" rx="20" fill="#ffffff" stroke="#F3D9DB" stroke-width="3"/>
    <circle cx="872" cy="142" r="18" fill="#F3D9DB"/>
    <text x="872" y="147" font-size="14" font-weight="700" text-anchor="middle" fill="#8B3A3F">3</text>

    <!-- ícone: enviar (check) vs não enviar (x) -->
    <circle cx="955" cy="195" r="26" fill="#EA1D2C"/>
    <polyline points="944,196 953,205 968,186" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="955" y="238" font-size="12" font-weight="700" text-anchor="middle" fill="#2d2d2d">Enviar</text>

    <circle cx="1025" cy="195" r="26" fill="#ffffff" stroke="#F3D9DB" stroke-width="3"/>
    <line x1="1015" y1="185" x2="1035" y2="205" stroke="#E7A9AD" stroke-width="4" stroke-linecap="round"/>
    <line x1="1035" y1="185" x2="1015" y2="205" stroke="#E7A9AD" stroke-width="4" stroke-linecap="round"/>
    <text x="1025" y="238" font-size="12" font-weight="700" text-anchor="middle" fill="#8a8a8a">Não enviar</text>

    <text x="990" y="300" font-size="18" font-weight="700" text-anchor="middle" fill="#2d2d2d">Decisão de envio</text>
    <text x="990" y="326" font-size="13" text-anchor="middle" fill="#767676">Envia somente quando</text>
    <text x="990" y="344" font-size="13" text-anchor="middle" fill="#767676">vale a pena para o negócio</text>
  </g>
</svg>
